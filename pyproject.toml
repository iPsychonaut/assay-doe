[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assay-doe"
version = "0.1.0"
description = "Design, analysis, and reporting for a randomized factorial assay experiment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ian Michael Bollinger", email = "ian.michael.bollinger@gmail.com" }]

[project.urls]
Repository = "https://github.com/iPsychonaut/assay-doe"

[tool.setuptools.packages.find]
where = ["src"]
